  /notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Marcar una notificación como leída (o no leída)
      description: |-
        Actualiza el estado `isRead` de la notificación.

        Rol requerido: dueño de la notificación (cualquier usuario autenticado, sobre
        sus propias notificaciones).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdateRequest'
            example:
              isRead: true
      responses:
        '200':
          description: Notificación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /notifications/internal/booking-status-changed:
    post:
      tags: [Notifications]
      operationId: triggerBookingStatusNotification
      summary: "[Interno] Disparar una notificación de cambio de estado de reserva"
      security:
        - internalApiKey: []
      description: |-
        Endpoint interno de servicio-a-servicio, invocado por Spot.Booking.Api cada
        vez que cambia `bookings.status` (confirmación, cancelación, completado,
        no-show), para que Spot.Notifications.Api genere y envíe la notificación push
        correspondiente al cliente y/o al dueño del negocio.

        No expuesto a clientes finales: el Gateway solo enruta esta llamada cuando
        proviene de la red interna de servicios, autenticada con una API key de
        servicio (header `X-Internal-Api-Key`) en lugar de un JWT de usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalBookingStatusNotificationRequest'
            example:
              bookingId: 2c3d4e5f-6071-4a2b-8c1d-9e0f1a2b3c4e
              businessId: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
              userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: CONFIRMED
      responses:
        '202':
          description: Notificación encolada para envío.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT emitido por Spot.Auth.Api, validado por el API Gateway antes de enrutar
        al microservicio destino. Incluye claims `sub` (user id) y `role`.
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: |-
        API key de servicio-a-servicio usada exclusivamente por microservicios
        internos (no por clientes finales) para invocar endpoints internos a través
        del Gateway.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    BusinessIdParam:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceIdParam:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingIdParam:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: La petición no pasó las validaciones de formato/input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: BAD_REQUEST
            message: El campo 'email' es requerido.
            details: { field: email }
            timestamp: "2026-08-30T20:00:00Z"
    Unauthorized:
      description: Falta el JWT, es inválido, o expiró.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: UNAUTHORIZED
            message: Tu sesión expiró, por favor inicia sesión nuevamente.
            timestamp: "2026-08-30T20:00:00Z"
    Forbidden:
      description: El usuario autenticado no tiene el rol o la propiedad requerida para esta acción.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: FORBIDDEN
            message: No tienes permiso para realizar esta acción.
            timestamp: "2026-08-30T20:00:00Z"
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: NOT_FOUND
            message: El recurso solicitado no existe.
            timestamp: "2026-08-30T20:00:00Z"
    Conflict:
      description: |-
        La operación entra en conflicto con el estado actual de los datos (por
        ejemplo, traslape de horario detectado por el exclusion constraint de
        reservaciones, un email ya registrado, o una reseña duplicada para la misma
        reservación).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: BOOKING_SLOT_OVERLAP
            message: Ese horario ya no está disponible para este negocio.
            timestamp: "2026-08-30T20:00:00Z"
    UnprocessableEntity:
      description: |-
        La petición es sintácticamente válida pero viola una regla de negocio (por
        ejemplo, reservar en un horario cerrado, o reseñar una reservación que no
        está completada).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: BOOKING_OUTSIDE_BUSINESS_HOURS
            message: El negocio está cerrado en el horario seleccionado.
            timestamp: "2026-08-30T20:00:00Z"
    InternalServerError:
      description: |-
        Error no controlado (por ejemplo, un fallo de base de datos). Nunca expone
        detalles internos; solo un código genérico y un mensaje amigable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: INTERNAL_ERROR
            message: Ocurrió un error inesperado. Por favor intenta de nuevo más tarde.
            timestamp: "2026-08-30T20:00:00Z"

  schemas:
    # ---------- Generic ----------
    Error:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: Código de error estable, legible por máquina.
          example: BOOKING_SLOT_OVERLAP
        message:
          type: string
          description: Mensaje amigable para mostrar al usuario final.
        details:
          description: Información adicional opcional sobre el error (nunca detalles internos sensibles).
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }

    # ---------- Enums ----------
    UserRole:
      type: string
      enum: [CLIENT, BUSINESS_OWNER, SUPERADMIN]
    ContactType:
      type: string
      enum: [PHONE, WHATSAPP, EMAIL, WEBSITE, FACEBOOK, INSTAGRAM, TIKTOK, OTHER]
    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
    AiRequestStatus:
      type: string
      enum: [SUCCESS, ERROR, TIMEOUT]
    AiRequestType:
      type: string
      enum: [BUSINESS_SEARCH, GENERAL_QUERY, OTHER]
    AuthProvider:
      type: string
      description: |-
        Proveedores de login social expuestos por la API. La base de datos reserva
        también FACEBOOK, APPLE y OTHER en el enum `auth_provider` para uso futuro,
        pero el MVP solo soporta GOOGLE.
      enum: [GOOGLE]
    NotificationType:
      type: string
      enum: [BOOKING_STATUS_CHANGED, GENERAL]
    DevicePlatform:
      type: string
      enum: [ANDROID, IOS, WEB]

    # ---------- Auth ----------
    User:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 30 }
        profilePhotoUrl: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/UserRole' }
        isActive: { type: boolean }
        linkedProviders:
          type: array
          description: |-
            Proveedores de login social vinculados a la cuenta (según
            `user_auth_providers`). Vacío si el usuario solo usa email/password.
          items: { $ref: '#/components/schemas/AuthProvider' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: ID token emitido por Google Identity Services para el usuario.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }

    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 30 }
        profilePhotoUrl: { type: [string, 'null'], format: uri }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer], default: Bearer }
        expiresIn:
          type: integer
          description: Segundos hasta la expiración del access token.
          example: 3600

    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }

    # ---------- Categories ----------
    Category:
      type: object
      required: [id, name, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentCategoryId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        parentCategoryId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: string }

    CategoryUpdateRequest:
      type: object
      properties:
        parentCategoryId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }

    PaginatedCategories:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Business ----------
    Business:
      type: object
      required: [id, name, slug, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        slug: { type: string, maxLength: 180 }
        description: { type: [string, 'null'] }
        legalName: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        website: { type: [string, 'null'], format: uri }
        logoUrl: { type: [string, 'null'], format: uri }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        legalName: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        website: { type: string, format: uri }
        logoUrl: { type: string, format: uri }

    BusinessUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        legalName: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        website: { type: [string, 'null'], format: uri }
        logoUrl: { type: [string, 'null'], format: uri }
        isActive: { type: boolean }

    PaginatedBusinesses:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Business' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    BusinessLocation:
      type: object
      required: [id, businessId, address, country, location, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        address: { type: string }
        city: { type: [string, 'null'], maxLength: 100 }
        province: { type: [string, 'null'], maxLength: 100 }
        country: { type: string, maxLength: 100, default: Costa Rica }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessLocationUpsertRequest:
      type: object
      required: [address, location]
      properties:
        address: { type: string }
        city: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100, default: Costa Rica }
        postalCode: { type: string, maxLength: 20 }
        location: { $ref: '#/components/schemas/GeoPoint' }

    BusinessContact:
      type: object
      required: [id, businessId, type, value, isPrimary, createdAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ContactType' }
        value: { type: string }
        isPrimary: { type: boolean }
        createdAt: { type: string, format: date-time }

    BusinessContactCreateRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: '#/components/schemas/ContactType' }
        value: { type: string }
        isPrimary: { type: boolean, default: false }

    PaginatedBusinessContacts:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessContact' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    BusinessHour:
      type: object
      required: [id, businessId, dayOfWeek, isClosed, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=domingo, 1=lunes, ..., 6=sábado.
        openTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$', example: "09:00:00" }
        closeTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$', example: "18:00:00" }
        isClosed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessHourInput:
      type: object
      required: [dayOfWeek, isClosed]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        openTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        closeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        isClosed: { type: boolean, default: false }

    BusinessHoursUpsertRequest:
      type: object
      required: [hours]
      properties:
        hours:
          type: array
          items: { $ref: '#/components/schemas/BusinessHourInput' }
          minItems: 1
          maxItems: 7

    PaginatedBusinessHours:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessHour' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    BusinessScheduleException:
      type: object
      required: [id, businessId, exceptionDate, isClosed, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        exceptionDate: { type: string, format: date }
        isClosed: { type: boolean }
        openTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        closeTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        reason: { type: [string, 'null'], maxLength: 255 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessScheduleExceptionCreateRequest:
      type: object
      required: [exceptionDate, isClosed]
      properties:
        exceptionDate: { type: string, format: date }
        isClosed: { type: boolean, default: false }
        openTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        closeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        reason: { type: string, maxLength: 255 }

    PaginatedScheduleExceptions:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessScheduleException' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Service:
      type: object
      required: [id, businessId, name, price, durationMinutes, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        price:
          type: number
          format: double
          minimum: 0
          description: Precio en colones (CRC).
        durationMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceCreateRequest:
      type: object
      required: [name, price, durationMinutes]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        price: { type: number, format: double, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }

    ServiceUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        price: { type: number, format: double, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean }

    PaginatedServices:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Service' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Product:
      type: object
      required: [id, businessId, name, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        price:
          type: [number, 'null']
          format: double
          minimum: 0
          description: Precio en colones (CRC). Puede ser nulo si el producto no se vende directamente.
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        price: { type: number, format: double, minimum: 0 }

    ProductUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        price: { type: [number, 'null'], format: double, minimum: 0 }
        isActive: { type: boolean }

    PaginatedProducts:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Photo:
      type: object
      required: [id, url, displayOrder, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        isPrimary:
          type: boolean
          description: Solo aplica a fotos de negocio; se omite/false en fotos de servicio o producto.
        displayOrder: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }

    PaginatedPhotos:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Booking ----------
    AvailabilitySlot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    AvailabilityDay:
      type: object
      required: [date, isClosed, slots]
      properties:
        date: { type: string, format: date }
        isClosed: { type: boolean }
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilitySlot' }

    AvailabilityResponse:
      type: object
      required: [businessId, from, to, days]
      properties:
        businessId: { type: string, format: uuid }
        serviceId: { type: [string, 'null'], format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityDay' }

    BookingService:
      type: object
      required: [id, serviceId, serviceName, unitPrice, durationMinutes, createdAt]
      properties:
        id: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        serviceName:
          type: string
          description: Copia del nombre del servicio al momento de la reserva.
        unitPrice: { type: number, format: double, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    Booking:
      type: object
      required: [id, userId, businessId, startAt, endAt, status, totalPrice, services, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/BookingStatus' }
        totalPrice: { type: number, format: double, minimum: 0, description: Monto total en colones (CRC). }
        notes: { type: [string, 'null'] }
        services:
          type: array
          items: { $ref: '#/components/schemas/BookingService' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookingCreateRequest:
      type: object
      required: [businessId, startAt, serviceIds]
      properties:
        businessId: { type: string, format: uuid }
        startAt:
          type: string
          format: date-time
          description: Hora de inicio deseada; `endAt` se calcula sumando la duración de los servicios elegidos.
        serviceIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        notes: { type: string }

    PaginatedBookings:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Review:
      type: object
      required: [id, bookingId, userId, businessId, rating, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewCreateRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    PaginatedReviews:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    FavoriteBusiness:
      type: object
      required: [businessId, createdAt, business]
      properties:
        businessId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        business: { $ref: '#/components/schemas/Business' }

    PaginatedFavorites:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FavoriteBusiness' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- AI Search ----------
    AiSearchQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 500
          description: Consulta del usuario en lenguaje natural.
        location: { $ref: '#/components/schemas/GeoPoint' }
        radiusKm: { type: number, format: double, minimum: 0.1, maximum: 100, default: 10 }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }

    AiSearchCriteria:
      type: object
      description: Criterios estructurados extraídos del lenguaje natural por el modelo de IA.
      properties:
        serviceQuery: { type: [string, 'null'], description: 'Texto del servicio buscado, ej. "corte de cabello".' }
        categoryId: { type: [string, 'null'], format: uuid }
        date: { type: [string, 'null'], format: date }
        time: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        budgetMaxColones: { type: [number, 'null'], format: double, minimum: 0 }
        rawLocationText: { type: [string, 'null'] }

    AiRequestSummary:
      type: object
      required: [id, status, requestType, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AiRequestStatus' }
        requestType: { $ref: '#/components/schemas/AiRequestType' }
        totalTokens: { type: [integer, 'null'], minimum: 0 }
        latencyMs: { type: [integer, 'null'], minimum: 0 }
        createdAt: { type: string, format: date-time }

    AiSearchResult:
      type: object
      required: [criteria, businesses, aiRequest]
      properties:
        criteria: { $ref: '#/components/schemas/AiSearchCriteria' }
        businesses: { $ref: '#/components/schemas/PaginatedBusinesses' }
        aiRequest: { $ref: '#/components/schemas/AiRequestSummary' }

    AiRequestLog:
      type: object
      description: Refleja fielmente la tabla `ai_requests`, para uso de auditoría interna.
      required: [id, provider, model, requestType, prompt, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        provider: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 100 }
        requestType: { $ref: '#/components/schemas/AiRequestType' }
        prompt: { type: string }
        response: { type: [string, 'null'] }
        extractedParameters:
          type: [object, 'null']
          additionalProperties: true
        toolCalls:
          type: [array, 'null']
          items: { type: object, additionalProperties: true }
        status: { $ref: '#/components/schemas/AiRequestStatus' }
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        totalTokens: { type: [integer, 'null'], minimum: 0 }
        latencyMs: { type: [integer, 'null'], minimum: 0 }
        errorCode: { type: [string, 'null'], maxLength: 100 }
        errorMessage: { type: [string, 'null'] }
        ipAddress: { type: [string, 'null'], format: ipv4 }
        userAgent: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    PaginatedAiRequests:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AiRequestLog' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Notifications ----------
    DeviceTokenRegisterRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform: { $ref: '#/components/schemas/DevicePlatform' }

    DeviceToken:
      type: object
      required: [id, platform, createdAt]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, userId, type, title, body, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        relatedEntityType: { type: [string, 'null'] }
        relatedEntityId: { type: [string, 'null'], format: uuid }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    PaginatedNotifications:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    NotificationUpdateRequest:
      type: object
      required: [isRead]
      properties:
        isRead: { type: boolean }

    InternalBookingStatusNotificationRequest:
      type: object
      required: [bookingId, businessId, userId, status]
      properties:
        bookingId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        message:
          type: string
          description: Mensaje opcional a incluir en la notificación; si se omite, se genera uno por defecto según `status`.

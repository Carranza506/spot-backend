      tags: [Booking]
      operationId: completeBooking
      summary: Marcar una reservación como completada
      description: |-
        Transiciona `status` a `COMPLETED`. Solo válido desde `CONFIRMED`; de lo
        contrario responde `422`. Habilita al cliente a dejar una reseña.

        Rol requerido: `BUSINESS_OWNER` dueño del negocio de la reservación.
      responses:
        '200':
          description: Reservación marcada como completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}/no-show:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Booking]
      operationId: markBookingNoShow
      summary: Marcar una reservación como no-show
      description: |-
        Transiciona `status` a `NO_SHOW`. Solo válido desde `CONFIRMED`; de lo

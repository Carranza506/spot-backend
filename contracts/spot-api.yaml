openapi: 3.1.0
info:
  title: Spot API
  version: "1.0.0"
  summary: Unified contract for the Spot API (all microservices).
  description: |-
    Spot is a service-booking platform (an MVP focused on beauty and personal
    care) built with a microservices architecture in .NET.

    ## Architecture and routing
    All routes described in this document are exposed to the client exclusively
    through the **API Gateway** (`Spot.Gateway`), under the `/api/v1/{service}/...`
    prefix, where `{service}` identifies the microservice that owns the resource:

    - `/api/v1/auth/...`          -> Spot.Auth.Api
    - `/api/v1/business/...`      -> Spot.Business.Api
    - `/api/v1/booking/...`       -> Spot.Booking.Api
    - `/api/v1/ai-search/...`     -> Spot.AiSearch.Api
    - `/api/v1/notifications/...` -> Spot.Notifications.Api

    The Gateway is responsible for validating the JWT (signature, expiration, and
    role claims) **before** routing the request to the corresponding microservice,
    with the sole exception of the public authentication endpoints:
    `POST /api/v1/auth/login`, `POST /api/v1/auth/register`,
    `POST /api/v1/auth/refresh`, and `POST /api/v1/auth/google`. The read-only
    business-discovery endpoints (public listing/search, business detail, service
    catalog, hours, availability, and reviews) are also served without
    authentication to support anonymous search.

    The internal endpoint `POST /api/v1/notifications/internal/booking-status-changed`
    is not exposed to end clients: the Gateway only routes it when the request
    comes from the internal service network (Spot.Booking.Api), authenticated with
    a service API key instead of a user JWT.

    ## Roles
    Each operation documents in its description the role(s) from the `user_role`
    enum (`CLIENT`, `BUSINESS_OWNER`, `SUPERADMIN`) authorized to invoke it.
    Operations on a specific business (services, hours, photos, etc.) also require
    the authenticated `BUSINESS_OWNER` user to own that business (the
    corresponding row in `business_owners`).

    ## Pagination
    Every listing endpoint accepts the `page` (>=1, default 1) and `pageSize`
    (1-100, default 20) query params, and wraps the result as
    `{ "data": [...], "pagination": { "page", "pageSize", "total", "totalPages" } }`.

    ## Errors
    All errors use the `Error` schema (`code`, `message`, `details?`, `timestamp`).
    `500` errors never expose internal details (stack traces, database engine
    messages, etc.), only a generic `code` and a friendly `message` for the end
    user.
  contact:
    name: Spot Engineering
    email: andres.carranza.moyano@est.una.ac.cr
servers:
  - url: https://api.spot.cr/api/v1
    description: Production (through the API Gateway)
  - url: https://staging-api.spot.cr/api/v1
    description: Staging (through the API Gateway)
  - url: http://localhost:5000/api/v1
    description: Local development gateway

tags:
  - name: Auth
    description: Registration, authentication (email/password and Google), session, and own profile. Spot.Auth.Api service.
  - name: Business
    description: Management of businesses, categories, location, contacts, hours, service catalog, and photos. Spot.Business.Api service.
  - name: Booking
    description: Availability, bookings, reviews, and favorites. Spot.Booking.Api service.
  - name: AiSearch
    description: AI-assisted natural language search and interaction auditing. Spot.AiSearch.Api service.
  - name: Notifications
    description: Device tokens, user notifications, and internal notification triggering. Spot.Notifications.Api service.

security:
  - bearerAuth: []

paths:
  # ============================================================
  # AUTH
  # ============================================================
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new user
      security: []
      description: |-
        Creates a new account with email and password. The default role is
        `CLIENT`; a `BUSINESS_OWNER` account is granted through a separate
        administrative flow (out of scope for the self-service MVP).

        Access: public (no JWT required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: maria.rodriguez@example.com
              password: "SuperClave#2026"
              firstName: María José
              lastName: Rodríguez Solís
              phone: "+506 8888-1234"
      responses:
        '201':
          description: User created and session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Log in with email and password
      security: []
      description: |-
        Main login mechanism for the MVP. Validates credentials against
        `users.password_hash` and issues a JWT access token and a refresh token.

        Access: public (no JWT required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria.rodriguez@example.com
              password: "SuperClave#2026"
      responses:
        '200':
          description: Successful login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: Log in / sign up with Google (optional)
      security: []
      description: |-
        Optional/secondary social login. Exchanges a Google ID token for a Spot
        session. If no row exists in `user_auth_providers` for
        `(provider='GOOGLE', provider_user_id)`, the user and their provider link
        are created automatically (linking by email if an account with a password
        already exists for that email).

        NOTE: this provider is tentative for the MVP and could be removed from the
        final scope if it doesn't add enough value over email/password login. The
        database's `auth_provider` enum only contemplates `GOOGLE`.

        Access: public (no JWT required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
            example:
              idToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.google-id-token
      responses:
        '200':
          description: Successful login/registration with Google.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Renew the access token using a refresh token
      security: []
      description: |-
        Exchanges a valid refresh token (a non-revoked, non-expired row in
        `refresh_tokens`) for a new token pair. The refresh token used is marked
        as rotated/revoked.

        Access: public (no JWT required; authenticated with the refresh token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out (revoke refresh token)
      description: |-
        Revokes the given refresh token (`refresh_tokens.revoked_at`).

        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session closed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getOwnProfile
      summary: Get the authenticated user's profile
      description: |-
        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: maria.rodriguez@example.com
                firstName: María José
                lastName: Rodríguez Solís
                phone: "+506 8888-1234"
                profilePhotoUrl: null
                role: CLIENT
                isActive: true
                createdAt: "2026-01-15T14:32:00Z"
                updatedAt: "2026-01-15T14:32:00Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Auth]
      operationId: updateOwnProfile
      summary: Update the authenticated user's profile
      description: |-
        Updates editable fields of the user's own profile (`first_name`,
        `last_name`, `phone`, `profile_photo_url`). Does not allow changing
        `email` or `role`.

        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the authenticated user's password
      description: |-
        Requires the current password to authorize the change. Revokes all of
        the user's active refresh tokens after the change.

        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ============================================================
  # BUSINESS - Categories
  # ============================================================
  /business/categories:
    get:
      tags: [Business]
      operationId: listCategories
      summary: List categories
      security: []
      description: |-
        Lists the category tree (`categories`), optionally filtered by parent
        category.

        Access: public (no JWT required).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: parentCategoryId
          in: query
          description: Filters by parent category id. Use `null` for root categories.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page of categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
              example:
                data:
                  - id: 8c5a0c1e-2a3a-4b1e-9f0a-1a2b3c4d5e6f
                    parentCategoryId: null
                    name: Belleza
                    description: Servicios relacionados con belleza y cuidado personal
                    isActive: true
                    createdAt: "2026-01-01T00:00:00Z"
                    updatedAt: "2026-01-01T00:00:00Z"
                pagination: { page: 1, pageSize: 20, total: 5, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createCategory
      summary: Create a category
      description: |-
        Required role: `SUPERADMIN`. Managing the global category catalog is an
        administrative task; business owners only assign existing categories to
        their businesses (see `PUT /business/businesses/{businessId}/categories`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Business]
      operationId: updateCategory
      summary: Update a category
      description: |-
        Required role: `SUPERADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ============================================================
  # BUSINESS - Businesses CRUD + search
  # ============================================================
  /business/businesses:
    get:
      tags: [Business]
      operationId: searchBusinesses
      summary: Search/list businesses (traditional search)
      security: []
      description: |-
        Public search of active businesses with traditional filters (text,
        category, city/province, and geographic proximity). For natural language
        search see `POST /ai-search/query`.

        Access: public (no JWT required).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: q
          in: query
          description: Free text searched in the business name and description.
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: city
          in: query
          schema: { type: string }
        - name: province
          in: query
          schema: { type: string }
        - name: lat
          in: query
          description: Latitude of the reference point for proximity search.
          schema: { type: number, format: double }
        - name: lng
          in: query
          description: Longitude of the reference point for proximity search.
          schema: { type: number, format: double }
        - name: radiusKm
          in: query
          description: Search radius in kilometers (requires `lat`/`lng`).
          schema: { type: number, format: double, minimum: 0.1, maximum: 100 }
      responses:
        '200':
          description: Page of businesses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinesses'
              example:
                data:
                  - id: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
                    name: Salón Bella Vista
                    slug: salon-bella-vista
                    description: Salón de belleza y estética en el centro de San José.
                    legalName: Bella Vista S.A.
                    email: contacto@bellavista.cr
                    phone: "+506 2222-3344"
                    website: "https://bellavista.cr"
                    logoUrl: "https://cdn.spot.cr/businesses/bella-vista/logo.png"
                    isActive: true
                    createdAt: "2026-01-10T09:00:00Z"
                    updatedAt: "2026-01-10T09:00:00Z"
                pagination: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createBusiness
      summary: Create a business
      description: |-
        Creates a business and registers the authenticated user as its owner in
        `business_owners`.

        Required role: `BUSINESS_OWNER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
            example:
              name: Salón Bella Vista
              description: Salón de belleza y estética en el centro de San José.
              legalName: Bella Vista S.A.
              email: contacto@bellavista.cr
              phone: "+506 2222-3344"
              website: "https://bellavista.cr"
      responses:
        '201':
          description: Business created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: getBusiness
      summary: Get a business's details
      security: []
      description: |-
        Access: public (no JWT required).
      responses:
        '200':
          description: Business details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Business]
      operationId: updateBusiness
      summary: Update a business
      description: |-
        Required role: `BUSINESS_OWNER` who owns the business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdateRequest'
      responses:
        '200':
          description: Business updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Business]
      operationId: deactivateBusiness
      summary: Deactivate (soft-delete) a business
      description: |-
        Sets `businesses.is_active = false`. Does not physically delete the
        record because it has associated bookings and reviews.

        Required role: `BUSINESS_OWNER` who owns the business.
      responses:
        '204':
          description: Business deactivated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/location:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: getBusinessLocation
      summary: Get a business's location
      security: []
      description: |-
        Access: public (no JWT required).
      responses:
        '200':
          description: Business location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessLocation'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Business]
      operationId: upsertBusinessLocation
      summary: Create or replace a business's location
      description: |-
        `business_locations.business_id` is unique: at most one location per
        business. This endpoint creates the row if it doesn't exist or replaces
        it if it already does.

        Required role: `BUSINESS_OWNER` who owns the business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessLocationUpsertRequest'
            example:
              address: 200 metros norte de la iglesia católica, San José Centro
              city: San José
              province: San José
              country: Costa Rica
              postalCode: "10101"
              location: { latitude: 9.9325, longitude: -84.0795 }
      responses:
        '200':
          description: Location created or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessLocation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/contacts:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: listBusinessContacts
      summary: List a business's contacts
      security: []
      description: |-
        Access: public (no JWT required).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessContacts'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createBusinessContact
      summary: Add a contact to a business
      description: |-
        Required role: `BUSINESS_OWNER` who owns the business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessContactCreateRequest'
            example:
              type: WHATSAPP
              value: "+506 8888-3344"
              isPrimary: true
      responses:
        '201':
          description: Contact created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessContact'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Business]
      operationId: deleteBusinessContact
      summary: Remove a contact from a business
      description: |-
        Required role: `BUSINESS_OWNER` who owns the business.
      responses:
        '204':
          description: Contact deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/hours:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: listBusinessHours
      summary: List a business's weekly schedule
      security: []
      description: |-
        Returns up to 7 rows from `business_hours` (one per `day_of_week`,
        0=Sunday..6=Saturday).

        Access: public (no JWT required).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of weekly hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessHours'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Business]
      operationId: replaceBusinessHours
      summary: Replace a business's full weekly schedule
      description: |-
        Replaces (upsert by `day_of_week`, unique constraint
        `(business_id,day_of_week)`) the business's complete weekly schedule in a
        single operation. Each day must satisfy that, if `isClosed=false`,
        `openTime` and `closeTime` are required and `openTime < closeTime`
        (validated by the `business_hours` CHECK).

        Required role: `BUSINESS_OWNER` who owns the business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessHoursUpsertRequest'
            example:
              hours:
                - dayOfWeek: 1
                  isClosed: false
                  openTime: "09:00:00"
                  closeTime: "18:00:00"
                - dayOfWeek: 0
                  isClosed: true
      responses:
        '200':
          description: Weekly schedule updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessHour'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }


  # ============================================================
  # BOOKING
  # ============================================================
  /booking/businesses/{businessId}/availability:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Booking]
      operationId: getBusinessAvailability
      summary: Query a business's real availability over a date range
      security: []
      description: |-
        Calculates the available slots by combining, for each day in the
        `[from, to]` range: (1) the base schedule for that day of the week in
        `business_hours` (or closed if `is_closed=true`), (2) overridden by a
        one-off exception in `business_schedule_exceptions` if one exists for
        that date, and (3) subtracting the blocks already taken by active
        bookings (`status IN ('PENDING','CONFIRMED')`) for the business, which
        are mutually exclusive thanks to the exclusion constraint
        `excl_active_booking_overlap` on `(business_id, tstzrange(start_at,end_at))`.
        If `serviceId` is given, the returned slots have the duration of that
        service (`services.duration_minutes`); if omitted, `slotMinutes` is used.

        Not paginated: the result is bounded by the requested date range
        (maximum 31 days).

        Access: public (no JWT required).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: serviceId
          in: query
          description: If given, slots are calculated with this service's duration.
          schema: { type: string, format: uuid }
        - name: slotMinutes
          in: query
          description: Slot duration when `serviceId` is not given.
          schema: { type: integer, minimum: 5, maximum: 480, default: 30 }
      responses:
        '200':
          description: Availability calculated for the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              example:
                businessId: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
                serviceId: 4d5e6f70-8192-4a3b-9c0d-1e2f3a4b5c6d
                from: "2026-09-01"
                to: "2026-09-02"
                days:
                  - date: "2026-09-01"
                    isClosed: false
                    slots:
                      - startAt: "2026-09-01T14:00:00Z"
                        endAt: "2026-09-01T14:45:00Z"
                      - startAt: "2026-09-01T15:00:00Z"
                        endAt: "2026-09-01T15:45:00Z"
                  - date: "2026-09-02"
                    isClosed: true
                    slots: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings:
    get:
      tags: [Booking]
      operationId: listOwnBookings
      summary: List the authenticated client's own bookings
      description: |-
        Required role: `CLIENT` (or another authenticated role querying its own
        history). Only returns bookings where `bookings.user_id` is the
        authenticated user.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
      responses:
        '200':
          description: Page of the client's own bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookings'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Booking]
      operationId: createBooking
      summary: Create a booking
      description: |-
        Creates a booking (`bookings`) for a single service (`service_id`),
        calculating `start_at`/`end_at` from the chosen service's duration and
        copying its name/price/duration at the time of booking (`service_name`,
        `service_price`, `service_duration_minutes`). Each booking is associated
        with exactly one service — `bookings` does not support multiple services
        per booking. The database guarantees, via the exclusion constraint
        `excl_active_booking_overlap`, that two active bookings (`PENDING`/
        `CONFIRMED`) for the same business cannot coexist with overlapping time
        ranges — attempting to book an already-taken slot responds `409`.
        Booking outside the business's hours (per `business_hours` /
        `business_schedule_exceptions`) responds `422`.

        Required role: `CLIENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
            example:
              businessId: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
              startAt: "2026-09-01T14:00:00Z"
              serviceId: 4d5e6f70-8192-4a3b-9c0d-1e2f3a4b5c6d
              notes: Preferiblemente con la estilista Ana.
      responses:
        '201':
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    get:
      tags: [Booking]
      operationId: getBooking
      summary: Get a booking's details
      description: |-
        Required role: `CLIENT` who owns the booking (`bookings.user_id`),
        `BUSINESS_OWNER` who owns the booking's business, or `SUPERADMIN`.
      responses:
        '200':
          description: Booking details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Booking]
      operationId: cancelBooking
      summary: Cancel a booking
      description: |-
        Transitions `status` to `CANCELLED`. Only valid from `PENDING` or
        `CONFIRMED`; canceling a booking that is already `COMPLETED`,
        `CANCELLED`, or `NO_SHOW` responds `422`.

        Required role: `CLIENT` who owns the booking or `BUSINESS_OWNER` who owns
        the booking's business.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}/complete:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Booking]
      operationId: completeBooking
      summary: Mark a booking as completed
      description: |-
        Transitions `status` to `COMPLETED`. Only valid from `CONFIRMED`;
        otherwise responds `422`. Enables the client to leave a review.

        Required role: `BUSINESS_OWNER` who owns the booking's business.
      responses:
        '200':
          description: Booking marked as completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}/no-show:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Booking]
      operationId: markBookingNoShow
      summary: Mark a booking as no-show
      description: |-
        Transitions `status` to `NO_SHOW`. Only valid from `CONFIRMED`;
        otherwise responds `422`.

        Required role: `BUSINESS_OWNER` who owns the booking's business.
      responses:
        '200':
          description: Booking marked as no-show.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}/review:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Booking]
      operationId: createBookingReview
      summary: Leave a review for a completed booking
      description: |-
        Creates a row in `reviews` for the booking. The `trg_validate_review`
        trigger requires that the booking exists, is in `COMPLETED` status, and
        that the review's user and business match those of the booking;
        violating any of these rules responds `422`. Since `reviews.booking_id`
        is unique, attempting to review a booking that already has a review
        responds `409`.

        Required role: `CLIENT` who owns the booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
            example:
              rating: 5
              comment: Excelente atención, muy puntuales y el resultado quedó increíble.
      responses:
        '201':
          description: Review created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/businesses/{businessId}/bookings:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Booking]
      operationId: listBusinessBookings
      summary: List a business's bookings
      description: |-
        Required role: `BUSINESS_OWNER` who owns the business.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of the business's bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookings'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/businesses/{businessId}/reviews:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Booking]
      operationId: listBusinessReviews
      summary: List a business's reviews
      security: []
      description: |-
        Access: public (no JWT required).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of the business's reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviews'
              example:
                data:
                  - id: 9a8b7c6d-5e4f-4a3b-9c0d-1e2f3a4b5c6d
                    bookingId: 2c3d4e5f-6071-4a2b-8c1d-9e0f1a2b3c4e
                    userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    businessId: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
                    rating: 5
                    comment: Excelente atención, muy puntuales.
                    createdAt: "2026-08-20T18:00:00Z"
                    updatedAt: "2026-08-20T18:00:00Z"
                pagination: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/favorites:
    get:
      tags: [Booking]
      operationId: listFavoriteBusinesses
      summary: List the authenticated client's favorite businesses
      description: |-
        Required role: `CLIENT`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of favorite businesses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFavorites'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/favorites/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    put:
      tags: [Booking]
      operationId: addFavoriteBusiness
      summary: Add a business to favorites
      description: |-
        Idempotent: adding a business that is already a favorite does not raise
        an error (`favorite_businesses` has a composite primary key
        `(user_id,business_id)`).

        Required role: `CLIENT`.
      responses:
        '204':
          description: Business added to favorites.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Booking]
      operationId: removeFavoriteBusiness
      summary: Remove a business from favorites
      description: |-
        Required role: `CLIENT`.
      responses:
        '204':
          description: Business removed from favorites.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ============================================================
  # AI SEARCH
  # ============================================================
  /ai-search/query:
    post:
      tags: [AiSearch]
      operationId: aiSearchQuery
      summary: Search for businesses using a natural language query
      description: |-
        Receives a natural language query plus the user's approximate location
        and returns (a) the structured criteria extracted by the AI model
        (service, date, time, budget, category) and (b) the businesses that
        match those criteria.

        Important: the AI model acts as a **stateless parser with no database
        access** — it only translates natural language into structured criteria
        (`AiSearchCriteria`). It is Spot.AiSearch.Api's own backend that
        validates those criteria and executes the actual business search
        against the database (delegating to the availability/search logic of
        Spot.Booking.Api / Spot.Business.Api); the model never queries or
        modifies data directly. Each invocation is logged as a row in
        `ai_requests` (prompt, response, tokens, latency, and status), whose
        summary is returned in the response's `aiRequest` field for
        traceability; the full history is queried via `GET /ai-search/requests`.

        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSearchQueryRequest'
            example:
              query: Busco un corte de cabello mañana en la tarde, presupuesto de 15 mil colones, cerca de Sarapiquí
              location: { latitude: 10.4653, longitude: -84.0068 }
              radiusKm: 15
      responses:
        '200':
          description: Extracted structured criteria and matching businesses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchResult'
              example:
                criteria:
                  serviceQuery: corte de cabello
                  categoryId: 8c5a0c1e-2a3a-4b1e-9f0a-1a2b3c4d5e6f
                  date: "2026-08-31"
                  time: "14:00:00"
                  budgetMaxColones: 15000
                  rawLocationText: Sarapiquí
                businesses:
                  data:
                    - id: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
                      name: Salón Bella Vista
                      slug: salon-bella-vista
                      description: Salón de belleza y estética en el centro de San José.
                      legalName: null
                      email: null
                      phone: null
                      website: null
                      logoUrl: null
                      isActive: true
                      createdAt: "2026-01-10T09:00:00Z"
                      updatedAt: "2026-01-10T09:00:00Z"
                  pagination: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
                aiRequest:
                  id: 7d6c5b4a-3e2f-4a1b-9c0d-8e7f6a5b4c3d
                  status: SUCCESS
                  requestType: BUSINESS_SEARCH
                  totalTokens: 412
                  latencyMs: 890
                  createdAt: "2026-08-30T20:15:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /ai-search/requests:
    get:
      tags: [AiSearch]
      operationId: listAiRequests
      summary: Internal audit of AI interactions
      description: |-
        Internal audit endpoint that exposes the raw history of `ai_requests`
        (prompt, response, extracted parameters, tokens, latency, status, and
        errors) for support, quality, and AI provider cost analysis.

        Required role: `SUPERADMIN`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AiRequestStatus' }
        - name: requestType
          in: query
          schema: { $ref: '#/components/schemas/AiRequestType' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Page of the AI interaction history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAiRequests'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /ai-search/requests/{aiRequestId}:
    parameters:
      - name: aiRequestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AiSearch]
      operationId: getAiRequest
      summary: Get an AI interaction's details
      description: |-
        Required role: `SUPERADMIN`.
      responses:
        '200':
          description: AI interaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestLog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  /notifications/device-tokens:
    post:
      tags: [Notifications]
      operationId: registerDeviceToken
      summary: Register a device's push token
      description: |-
        Registers (or reactivates, if it already existed and was inactive) the
        authenticated user's device push token for sending notifications.

        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRegisterRequest'
            example:
              token: fcm-token-abc123
              platform: ANDROID
      responses:
        '201':
          description: Token registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /notifications/device-tokens/{deviceTokenId}:
    parameters:
      - name: deviceTokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Notifications]
      operationId: removeDeviceToken
      summary: Delete a device's push token
      description: |-
        Required role: owner of the token (any authenticated user, over their
        own tokens).
      responses:
        '204':
          description: Token deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listOwnNotifications
      summary: List the authenticated user's notifications
      description: |-
        Required role: any authenticated user (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`), over their own notifications.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: isRead
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
              example:
                data:
                  - id: 5f4e3d2c-1b0a-4a1b-8c2d-9e0f1a2b3c4d
                    userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    type: BOOKING_STATUS_CHANGED
                    title: Tu reservación fue confirmada
                    body: Salón Bella Vista confirmó tu cita del 1 de setiembre a las 2:00pm.
                    relatedEntityType: booking
                    relatedEntityId: 2c3d4e5f-6071-4a2b-8c1d-9e0f1a2b3c4e
                    isRead: false
                    createdAt: "2026-08-30T20:20:00Z"
                pagination: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read (or unread)
      description: |-
        Updates the notification's `isRead` state.

        Required role: owner of the notification (any authenticated user, over
        their own notifications).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdateRequest'
            example:
              isRead: true
      responses:
        '200':
          description: Notification updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /notifications/internal/booking-status-changed:
    post:
      tags: [Notifications]
      operationId: triggerBookingStatusNotification
      summary: "[Internal] Trigger a booking status change notification"
      security:
        - internalApiKey: []
      description: |-
        Internal service-to-service endpoint, invoked by Spot.Booking.Api every
        time `bookings.status` changes (confirmation, cancellation, completion,
        no-show), so that Spot.Notifications.Api generates and sends the
        corresponding push notification to the client and/or the business owner.

        Not exposed to end clients: the Gateway only routes this call when it
        comes from the internal service network, authenticated with a service
        API key (header `X-Internal-Api-Key`) instead of a user JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalBookingStatusNotificationRequest'
            example:
              bookingId: 2c3d4e5f-6071-4a2b-8c1d-9e0f1a2b3c4e
              businessId: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
              userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: CONFIRMED
      responses:
        '202':
          description: Notification queued for delivery.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT issued by Spot.Auth.Api, validated by the API Gateway before
        routing to the destination microservice. Includes the `sub` (user id)
        and `role` claims.
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: |-
        Service-to-service API key used exclusively by internal microservices
        (not by end clients) to invoke internal endpoints through the Gateway.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    BusinessIdParam:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceIdParam:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingIdParam:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request failed format/input validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: BAD_REQUEST
            message: El campo 'email' es requerido.
            details: { field: email }
            timestamp: "2026-08-30T20:00:00Z"
    Unauthorized:
      description: The JWT is missing, invalid, or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: UNAUTHORIZED
            message: Tu sesión expiró, por favor inicia sesión nuevamente.
            timestamp: "2026-08-30T20:00:00Z"
    Forbidden:
      description: The authenticated user does not have the role or ownership required for this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: FORBIDDEN
            message: No tienes permiso para realizar esta acción.
            timestamp: "2026-08-30T20:00:00Z"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: NOT_FOUND
            message: El recurso solicitado no existe.
            timestamp: "2026-08-30T20:00:00Z"
    Conflict:
      description: |-
        The operation conflicts with the current state of the data (for
        example, a schedule overlap detected by the bookings exclusion
        constraint, an already-registered email, or a duplicate review for the
        same booking).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: BOOKING_SLOT_OVERLAP
            message: Ese horario ya no está disponible para este negocio.
            timestamp: "2026-08-30T20:00:00Z"
    UnprocessableEntity:
      description: |-
        The request is syntactically valid but violates a business rule (for
        example, booking during closed hours, or reviewing a booking that is
        not completed).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: BOOKING_OUTSIDE_BUSINESS_HOURS
            message: El negocio está cerrado en el horario seleccionado.
            timestamp: "2026-08-30T20:00:00Z"
    InternalServerError:
      description: |-
        Unhandled error (for example, a database failure). Never exposes
        internal details; only a generic code and a friendly message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: INTERNAL_ERROR
            message: Ocurrió un error inesperado. Por favor intenta de nuevo más tarde.
            timestamp: "2026-08-30T20:00:00Z"

  schemas:
    # ---------- Generic ----------
    Error:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          example: BOOKING_SLOT_OVERLAP
        message:
          type: string
          description: Friendly message to show the end user.
        details:
          description: Optional additional information about the error (never sensitive internal details).
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }

    # ---------- Enums ----------
    UserRole:
      type: string
      enum: [CLIENT, BUSINESS_OWNER, SUPERADMIN]
    ContactType:
      type: string
      enum: [PHONE, WHATSAPP, EMAIL, WEBSITE, FACEBOOK, INSTAGRAM, TIKTOK, OTHER]
    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
    AiRequestStatus:
      type: string
      enum: [SUCCESS, ERROR, TIMEOUT]
    AiRequestType:
      type: string
      enum: [BUSINESS_SEARCH, GENERAL_QUERY, OTHER]
    AuthProvider:
      type: string
      description: |-
        Supported social login providers. Faithfully reflects the database's
        `auth_provider` enum, which currently only contemplates GOOGLE.
      enum: [GOOGLE]
    NotificationType:
      type: string
      enum: [BOOKING_STATUS_CHANGED, GENERAL]
    DevicePlatform:
      type: string
      enum: [ANDROID, IOS, WEB]

    # ---------- Auth ----------
    User:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 30 }
        profilePhotoUrl: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/UserRole' }
        isActive: { type: boolean }
        linkedProviders:
          type: array
          description: |-
            Social login providers linked to the account (per
            `user_auth_providers`). Empty if the user only uses email/password.
          items: { $ref: '#/components/schemas/AuthProvider' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: ID token issued by Google Identity Services for the user.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }

    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 30 }
        profilePhotoUrl: { type: [string, 'null'], format: uri }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer], default: Bearer }
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 3600

    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }

    # ---------- Categories ----------
    Category:
      type: object
      required: [id, name, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentCategoryId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        parentCategoryId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: string }

    CategoryUpdateRequest:
      type: object
      properties:
        parentCategoryId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }

    PaginatedCategories:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Business ----------
    Business:
      type: object
      required: [id, name, slug, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        slug: { type: string, maxLength: 180 }
        description: { type: [string, 'null'] }
        legalName: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        website: { type: [string, 'null'], format: uri }
        logoUrl: { type: [string, 'null'], format: uri }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        legalName: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        website: { type: string, format: uri }
        logoUrl: { type: string, format: uri }

    BusinessUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        legalName: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        website: { type: [string, 'null'], format: uri }
        logoUrl: { type: [string, 'null'], format: uri }
        isActive: { type: boolean }

    PaginatedBusinesses:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Business' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    BusinessLocation:
      type: object
      required: [id, businessId, address, country, location, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        address: { type: string }
        city: { type: [string, 'null'], maxLength: 100 }
        province: { type: [string, 'null'], maxLength: 100 }
        country: { type: string, maxLength: 100, default: Costa Rica }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessLocationUpsertRequest:
      type: object
      required: [address, location]
      properties:
        address: { type: string }
        city: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100, default: Costa Rica }
        postalCode: { type: string, maxLength: 20 }
        location: { $ref: '#/components/schemas/GeoPoint' }

    BusinessContact:
      type: object
      required: [id, businessId, type, value, isPrimary, createdAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ContactType' }
        value: { type: string }
        isPrimary: { type: boolean }
        createdAt: { type: string, format: date-time }

    BusinessContactCreateRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: '#/components/schemas/ContactType' }
        value: { type: string }
        isPrimary: { type: boolean, default: false }

    PaginatedBusinessContacts:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessContact' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    BusinessHour:
      type: object
      required: [id, businessId, dayOfWeek, isClosed, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Sunday, 1=Monday, ..., 6=Saturday.
        openTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$', example: "09:00:00" }
        closeTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$', example: "18:00:00" }
        isClosed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessHourInput:
      type: object
      required: [dayOfWeek, isClosed]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        openTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        closeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        isClosed: { type: boolean, default: false }

    BusinessHoursUpsertRequest:
      type: object
      required: [hours]
      properties:
        hours:
          type: array
          items: { $ref: '#/components/schemas/BusinessHourInput' }
          minItems: 1
          maxItems: 7

    PaginatedBusinessHours:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessHour' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    BusinessScheduleException:
      type: object
      required: [id, businessId, exceptionDate, isClosed, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        exceptionDate: { type: string, format: date }
        isClosed: { type: boolean }
        openTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        closeTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        reason: { type: [string, 'null'], maxLength: 255 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessScheduleExceptionCreateRequest:
      type: object
      required: [exceptionDate, isClosed]
      properties:
        exceptionDate: { type: string, format: date }
        isClosed: { type: boolean, default: false }
        openTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        closeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        reason: { type: string, maxLength: 255 }

    PaginatedScheduleExceptions:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessScheduleException' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Service:
      type: object
      required: [id, businessId, name, price, durationMinutes, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        price:
          type: number
          format: double
          minimum: 0
          description: Price in Costa Rican colones (CRC).
        durationMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceCreateRequest:
      type: object
      required: [name, price, durationMinutes]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        price: { type: number, format: double, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }

    ServiceUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
        price: { type: number, format: double, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean }

    PaginatedServices:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Service' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Photo:
      type: object
      required: [id, url, displayOrder, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        isPrimary:
          type: boolean
          description: Only applies to business photos; omitted/false on service photos.
        displayOrder: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }

    PaginatedPhotos:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Booking ----------
    AvailabilitySlot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    AvailabilityDay:
      type: object
      required: [date, isClosed, slots]
      properties:
        date: { type: string, format: date }
        isClosed: { type: boolean }
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilitySlot' }

    AvailabilityResponse:
      type: object
      required: [businessId, from, to, days]
      properties:
        businessId: { type: string, format: uuid }
        serviceId: { type: [string, 'null'], format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityDay' }

    Booking:
      type: object
      required: [id, userId, businessId, serviceId, startAt, endAt, status, serviceName, servicePrice, serviceDurationMinutes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        serviceId:
          type: string
          format: uuid
          description: Each booking is associated with exactly one service (`bookings.service_id`).
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/BookingStatus' }
        serviceName:
          type: string
          description: Copy of the service's name at the time of booking.
        servicePrice:
          type: number
          format: double
          minimum: 0
          description: Copy of the service's price (in Costa Rican colones, CRC) at the time of booking.
        serviceDurationMinutes:
          type: integer
          minimum: 1
          description: Copy of the service's duration (in minutes) at the time of booking.
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookingCreateRequest:
      type: object
      required: [businessId, startAt, serviceId]
      properties:
        businessId: { type: string, format: uuid }
        startAt:
          type: string
          format: date-time
          description: Desired start time; `endAt` is calculated by adding the chosen service's duration.
        serviceId:
          type: string
          format: uuid
          description: Service to book. A booking can only have one service (`bookings.service_id`).
        notes: { type: string }

    PaginatedBookings:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    Review:
      type: object
      required: [id, bookingId, userId, businessId, rating, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewCreateRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    PaginatedReviews:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    FavoriteBusiness:
      type: object
      required: [businessId, createdAt, business]
      properties:
        businessId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        business: { $ref: '#/components/schemas/Business' }

    PaginatedFavorites:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FavoriteBusiness' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- AI Search ----------
    AiSearchQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 500
          description: User's query in natural language.
        location: { $ref: '#/components/schemas/GeoPoint' }
        radiusKm: { type: number, format: double, minimum: 0.1, maximum: 100, default: 10 }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }

    AiSearchCriteria:
      type: object
      description: Structured criteria extracted from natural language by the AI model.
      properties:
        serviceQuery: { type: [string, 'null'], description: 'Text of the searched service, e.g. "haircut".' }
        categoryId: { type: [string, 'null'], format: uuid }
        date: { type: [string, 'null'], format: date }
        time: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$' }
        budgetMaxColones: { type: [number, 'null'], format: double, minimum: 0 }
        rawLocationText: { type: [string, 'null'] }

    AiRequestSummary:
      type: object
      required: [id, status, requestType, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AiRequestStatus' }
        requestType: { $ref: '#/components/schemas/AiRequestType' }
        totalTokens: { type: [integer, 'null'], minimum: 0 }
        latencyMs: { type: [integer, 'null'], minimum: 0 }
        createdAt: { type: string, format: date-time }

    AiSearchResult:
      type: object
      required: [criteria, businesses, aiRequest]
      properties:
        criteria: { $ref: '#/components/schemas/AiSearchCriteria' }
        businesses: { $ref: '#/components/schemas/PaginatedBusinesses' }
        aiRequest: { $ref: '#/components/schemas/AiRequestSummary' }

    AiRequestLog:
      type: object
      description: Faithfully reflects the `ai_requests` table, for internal audit use.
      required: [id, provider, model, requestType, prompt, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        provider: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 100 }
        requestType: { $ref: '#/components/schemas/AiRequestType' }
        prompt: { type: string }
        response: { type: [string, 'null'] }
        extractedParameters:
          type: [object, 'null']
          additionalProperties: true
        toolCalls:
          type: [array, 'null']
          items: { type: object, additionalProperties: true }
        status: { $ref: '#/components/schemas/AiRequestStatus' }
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        totalTokens: { type: [integer, 'null'], minimum: 0 }
        latencyMs: { type: [integer, 'null'], minimum: 0 }
        errorCode: { type: [string, 'null'], maxLength: 100 }
        errorMessage: { type: [string, 'null'] }
        ipAddress: { type: [string, 'null'], format: ipv4 }
        userAgent: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    PaginatedAiRequests:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AiRequestLog' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    # ---------- Notifications ----------
    DeviceTokenRegisterRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform: { $ref: '#/components/schemas/DevicePlatform' }

    DeviceToken:
      type: object
      required: [id, platform, createdAt]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, userId, type, title, body, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        relatedEntityType: { type: [string, 'null'] }
        relatedEntityId: { type: [string, 'null'], format: uuid }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    PaginatedNotifications:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    NotificationUpdateRequest:
      type: object
      required: [isRead]
      properties:
        isRead: { type: boolean }

    InternalBookingStatusNotificationRequest:
      type: object
      required: [bookingId, businessId, userId, status]
      properties:
        bookingId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        message:
          type: string
          description: Optional message to include in the notification; if omitted, a default one is generated based on `status`.

  # ============================================================
  # AI SEARCH
  # ============================================================
  /ai-search/query:
    post:
      tags: [AiSearch]
      operationId: aiSearchQuery
      summary: Buscar negocios usando una consulta en lenguaje natural
      description: |-
        Recibe una consulta en lenguaje natural más la ubicación aproximada del
        usuario y devuelve (a) los criterios estructurados extraídos por el modelo de
        IA (servicio, fecha, hora, presupuesto, categoría) y (b) los negocios que
        cumplen esos criterios.

        Importante: el modelo de IA actúa como un **parser stateless sin acceso a
        base de datos** — únicamente traduce lenguaje natural a criterios
        estructurados (`AiSearchCriteria`). Es el propio backend de Spot.AiSearch.Api
        quien valida esos criterios y ejecuta la búsqueda real de negocios contra la
        base de datos (delegando en la lógica de disponibilidad/búsqueda de
        Spot.Booking.Api / Spot.Business.Api); el modelo nunca consulta ni modifica
        datos directamente. Cada invocación se registra como una fila en
        `ai_requests` (prompt, respuesta, tokens, latencia y estado), cuyo resumen se
        devuelve en el campo `aiRequest` de la respuesta para trazabilidad; el
        historial completo se consulta vía `GET /ai-search/requests`.

        Rol requerido: cualquier usuario autenticado (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSearchQueryRequest'
            example:
              query: Busco un corte de cabello mañana en la tarde, presupuesto de 15 mil colones, cerca de Sarapiquí
              location: { latitude: 10.4653, longitude: -84.0068 }
              radiusKm: 15
      responses:
        '200':
          description: Criterios estructurados extraídos y negocios que califican.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchResult'
              example:
                criteria:
                  serviceQuery: corte de cabello
                  categoryId: 8c5a0c1e-2a3a-4b1e-9f0a-1a2b3c4d5e6f
                  date: "2026-08-31"
                  time: "14:00:00"
                  budgetMaxColones: 15000
                  rawLocationText: Sarapiquí
                businesses:
                  data:
                    - id: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
                      name: Salón Bella Vista
                      slug: salon-bella-vista
                      description: Salón de belleza y estética en el centro de San José.
                      legalName: null
                      email: null
                      phone: null
                      website: null
                      logoUrl: null
                      isActive: true
                      createdAt: "2026-01-10T09:00:00Z"
                      updatedAt: "2026-01-10T09:00:00Z"
                  pagination: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
                aiRequest:
                  id: 7d6c5b4a-3e2f-4a1b-9c0d-8e7f6a5b4c3d
                  status: SUCCESS
                  requestType: BUSINESS_SEARCH
                  totalTokens: 412
                  latencyMs: 890
                  createdAt: "2026-08-30T20:15:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /ai-search/requests:
    get:
      tags: [AiSearch]
      operationId: listAiRequests
      summary: Auditoría interna de interacciones de IA
      description: |-
        Endpoint interno de auditoría que expone el historial crudo de
        `ai_requests` (prompt, respuesta, parámetros extraídos, tokens, latencia,
        estado y errores) para soporte, calidad y análisis de costos del proveedor de
        IA.

        Rol requerido: `SUPERADMIN`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AiRequestStatus' }
        - name: requestType
          in: query
          schema: { $ref: '#/components/schemas/AiRequestType' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página del historial de interacciones de IA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAiRequests'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /ai-search/requests/{aiRequestId}:
    parameters:
      - name: aiRequestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AiSearch]
      operationId: getAiRequest
      summary: Obtener el detalle de una interacción de IA
      description: |-
        Rol requerido: `SUPERADMIN`.
      responses:
        '200':
          description: Detalle de la interacción de IA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestLog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }


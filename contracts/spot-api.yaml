        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /booking/bookings/{bookingId}/review:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Booking]
      operationId: createBookingReview
      summary: Dejar una reseña de una reservación completada
      description: |-
        Crea una fila en `reviews` para la reservación. El trigger
        `trg_validate_review` obliga a que la reservación exista, esté en estado
        `COMPLETED`, y que el usuario y negocio de la reseña coincidan con los de la
        reservación; violar cualquiera de estas reglas responde `422`. Como
        `reviews.booking_id` es único, intentar reseñar una reservación que ya tiene
        reseña responde `409`.

        Rol requerido: `CLIENT` dueño de la reservación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
            example:
              rating: 5
              comment: Excelente atención, muy puntuales y el resultado quedó increíble.
      responses:
        '201':
          description: Reseña creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }


openapi: 3.1.0
info:
  title: Spot API
  version: "1.0.0"
  summary: Contrato unificado de la API de Spot (todos los microservicios).
  description: |-
    Spot es una plataforma de reservas de servicios (MVP enfocado en belleza y aseo
    personal) construida con una arquitectura de microservicios en .NET.

    ## Arquitectura y ruteo
    Todas las rutas descritas en este documento son expuestas al cliente exclusivamente
    a través del **API Gateway** (`Spot.Gateway`), bajo el prefijo `/api/v1/{servicio}/...`,
    donde `{servicio}` identifica al microservicio dueño del recurso:

    - `/api/v1/auth/...`          -> Spot.Auth.Api
    - `/api/v1/business/...`      -> Spot.Business.Api
    - `/api/v1/booking/...`       -> Spot.Booking.Api
    - `/api/v1/ai-search/...`     -> Spot.AiSearch.Api
    - `/api/v1/notifications/...` -> Spot.Notifications.Api

    El Gateway es responsable de validar el JWT (firma, expiración y claims de rol)
    **antes** de enrutar la petición al microservicio correspondiente, con la única
    excepción de los endpoints públicos de autenticación:
    `POST /api/v1/auth/login`, `POST /api/v1/auth/register`,
    `POST /api/v1/auth/refresh` y `POST /api/v1/auth/google`. Los endpoints de
    solo-lectura de descubrimiento de negocios (listado/búsqueda pública, detalle de
    negocio, catálogo de servicios/productos, horarios, disponibilidad y reseñas) también
    se sirven sin autenticación para soportar la búsqueda anónima.

    El endpoint interno `POST /api/v1/notifications/internal/booking-status-changed`
    no está expuesto a clientes finales: el Gateway solo lo enruta cuando la petición
    proviene de la red interna de servicios (Spot.Booking.Api), autenticada con una
    API key de servicio en lugar de un JWT de usuario.

    ## Roles
    Cada operación documenta en su descripción el/los rol(es) del enum `user_role`
    (`CLIENT`, `BUSINESS_OWNER`, `SUPERADMIN`) autorizados a invocarla. Las operaciones
    sobre un negocio específico (servicios, productos, horarios, fotos, etc.) además
    requieren que el usuario `BUSINESS_OWNER` autenticado sea dueño de ese negocio
    (fila correspondiente en `business_owners`).

    ## Paginación
    Todo endpoint de listado acepta los query params `page` (>=1, default 1) y
    `pageSize` (1-100, default 20), y envuelve el resultado como
    `{ "data": [...], "pagination": { "page", "pageSize", "total", "totalPages" } }`.

    ## Errores
    Todos los errores usan el schema `Error` (`code`, `message`, `details?`, `timestamp`).
    Los errores `500` nunca exponen detalles internos (stack traces, mensajes de motor
    de base de datos, etc.), solo un `code` genérico y un `message` amigable para el
    usuario final.
  contact:
    name: Spot Engineering
    email: andres.carranza.moyano@est.una.ac.cr
servers:
  - url: https://api.spot.cr/api/v1
    description: Producción (a través del API Gateway)
  - url: https://staging-api.spot.cr/api/v1
    description: Staging (a través del API Gateway)
  - url: http://localhost:5000/api/v1
    description: Gateway local de desarrollo

tags:
  - name: Auth
    description: Registro, autenticación (email/password y Google), sesión y perfil propio. Servicio Spot.Auth.Api.
  - name: Business
    description: Gestión de negocios, categorías, ubicación, contactos, horarios, catálogo de servicios/productos y fotos. Servicio Spot.Business.Api.
  - name: Booking
    description: Disponibilidad, reservaciones, reseñas y favoritos. Servicio Spot.Booking.Api.
  - name: AiSearch
    description: Búsqueda en lenguaje natural asistida por IA y auditoría de interacciones. Servicio Spot.AiSearch.Api.
  - name: Notifications
    description: Tokens de dispositivo, notificaciones del usuario y disparo interno de notificaciones. Servicio Spot.Notifications.Api.

security:
  - bearerAuth: []

paths:
  # ============================================================
  # AUTH
  # ============================================================
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Registrar un nuevo usuario
      security: []
      description: |-
        Crea una cuenta nueva con email y password. El rol por defecto es `CLIENT`;
        una cuenta `BUSINESS_OWNER` se otorga mediante un flujo administrativo aparte
        (fuera de alcance del MVP self-service).

        Acceso: público (no requiere JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: maria.rodriguez@example.com
              password: "SuperClave#2026"
              firstName: María José
              lastName: Rodríguez Solís
              phone: "+506 8888-1234"
      responses:
        '201':
          description: Usuario creado y sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Iniciar sesión con email y password
      security: []
      description: |-
        Mecanismo de login principal del MVP. Valida credenciales contra
        `users.password_hash` y emite un access token JWT y un refresh token.

        Acceso: público (no requiere JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria.rodriguez@example.com
              password: "SuperClave#2026"
      responses:
        '200':
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: Iniciar sesión / registrarse con Google (opcional)
      security: []
      description: |-
        Login social opcional/secundario. Intercambia un ID token de Google por una
        sesión de Spot. Si no existe una fila en `user_auth_providers` para
        `(provider='GOOGLE', provider_user_id)`, se crea el usuario y su vínculo de
        proveedor automáticamente (vinculando por email si ya existe una cuenta con
        password para ese correo).

        NOTA: este proveedor es tentativo para el MVP y podría removerse del alcance
        final si no aporta suficiente valor frente al login con email/password.
        Facebook y Apple no están soportados; aunque el enum `auth_provider` de la
        base de datos los contempla, no se exponen en la API.

        Acceso: público (no requiere JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
            example:
              idToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.google-id-token
      responses:
        '200':
          description: Login/registro con Google exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Renovar el access token usando un refresh token
      security: []
      description: |-
        Intercambia un refresh token vigente (fila no revocada y no expirada en
        `refresh_tokens`) por un nuevo par de tokens. El refresh token usado se marca
        como rotado/revocado.

        Acceso: público (no requiere JWT; se autentica con el refresh token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens renovados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesión (revocar refresh token)
      description: |-
        Revoca el refresh token indicado (`refresh_tokens.revoked_at`).

        Rol requerido: cualquier usuario autenticado (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getOwnProfile
      summary: Obtener el perfil del usuario autenticado
      description: |-
        Rol requerido: cualquier usuario autenticado (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      responses:
        '200':
          description: Perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: maria.rodriguez@example.com
                firstName: María José
                lastName: Rodríguez Solís
                phone: "+506 8888-1234"
                profilePhotoUrl: null
                role: CLIENT
                isActive: true
                createdAt: "2026-01-15T14:32:00Z"
                updatedAt: "2026-01-15T14:32:00Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Auth]
      operationId: updateOwnProfile
      summary: Actualizar el perfil del usuario autenticado
      description: |-
        Actualiza campos editables del propio perfil (`first_name`, `last_name`,
        `phone`, `profile_photo_url`). No permite cambiar `email` ni `role`.

        Rol requerido: cualquier usuario autenticado (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Cambiar la contraseña del usuario autenticado
      description: |-
        Requiere la contraseña actual para autorizar el cambio. Revoca todos los
        refresh tokens activos del usuario tras el cambio.

        Rol requerido: cualquier usuario autenticado (`CLIENT`, `BUSINESS_OWNER`,
        `SUPERADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña actualizada.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ============================================================
  # BUSINESS - Categories
  # ============================================================
  /business/categories:
    get:
      tags: [Business]
      operationId: listCategories
      summary: Listar categorías
      security: []
      description: |-
        Lista el árbol de categorías (`categories`), opcionalmente filtrado por
        categoría padre.

        Acceso: público (no requiere JWT).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: parentCategoryId
          in: query
          description: Filtra por id de categoría padre. Usar `null` para categorías raíz.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de categorías.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
              example:
                data:
                  - id: 8c5a0c1e-2a3a-4b1e-9f0a-1a2b3c4d5e6f
                    parentCategoryId: null
                    name: Belleza
                    description: Servicios relacionados con belleza y cuidado personal
                    isActive: true
                    createdAt: "2026-01-01T00:00:00Z"
                    updatedAt: "2026-01-01T00:00:00Z"
                pagination: { page: 1, pageSize: 20, total: 5, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createCategory
      summary: Crear una categoría
      description: |-
        Rol requerido: `SUPERADMIN`. La gestión del catálogo global de categorías es
        administrativa; los dueños de negocio solo asignan categorías existentes a
        sus negocios (ver `PUT /business/businesses/{businessId}/categories`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Business]
      operationId: updateCategory
      summary: Actualizar una categoría
      description: |-
        Rol requerido: `SUPERADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ============================================================
  # BUSINESS - Businesses CRUD + search
  # ============================================================
  /business/businesses:
    get:
      tags: [Business]
      operationId: searchBusinesses
      summary: Buscar/listar negocios (búsqueda tradicional)
      security: []
      description: |-
        Búsqueda pública de negocios activos con filtros tradicionales (texto,
        categoría, ciudad/provincia y cercanía geográfica). Para búsqueda en lenguaje
        natural ver `POST /ai-search/query`.

        Acceso: público (no requiere JWT).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: q
          in: query
          description: Texto libre buscado en nombre y descripción del negocio.
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: city
          in: query
          schema: { type: string }
        - name: province
          in: query
          schema: { type: string }
        - name: lat
          in: query
          description: Latitud del punto de referencia para búsqueda por cercanía.
          schema: { type: number, format: double }
        - name: lng
          in: query
          description: Longitud del punto de referencia para búsqueda por cercanía.
          schema: { type: number, format: double }
        - name: radiusKm
          in: query
          description: Radio de búsqueda en kilómetros (requiere `lat`/`lng`).
          schema: { type: number, format: double, minimum: 0.1, maximum: 100 }
      responses:
        '200':
          description: Página de negocios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinesses'
              example:
                data:
                  - id: 1b2c3d4e-5f60-4a1b-8c2d-9e0f1a2b3c4d
                    name: Salón Bella Vista
                    slug: salon-bella-vista
                    description: Salón de belleza y estética en el centro de San José.
                    legalName: Bella Vista S.A.
                    email: contacto@bellavista.cr
                    phone: "+506 2222-3344"
                    website: "https://bellavista.cr"
                    logoUrl: "https://cdn.spot.cr/businesses/bella-vista/logo.png"
                    isActive: true
                    createdAt: "2026-01-10T09:00:00Z"
                    updatedAt: "2026-01-10T09:00:00Z"
                pagination: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createBusiness
      summary: Crear un negocio
      description: |-
        Crea un negocio y registra al usuario autenticado como dueño en
        `business_owners`.

        Rol requerido: `BUSINESS_OWNER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
            example:
              name: Salón Bella Vista
              description: Salón de belleza y estética en el centro de San José.
              legalName: Bella Vista S.A.
              email: contacto@bellavista.cr
              phone: "+506 2222-3344"
              website: "https://bellavista.cr"
      responses:
        '201':
          description: Negocio creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: getBusiness
      summary: Obtener el detalle de un negocio
      security: []
      description: |-
        Acceso: público (no requiere JWT).
      responses:
        '200':
          description: Detalle del negocio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Business]
      operationId: updateBusiness
      summary: Actualizar un negocio
      description: |-
        Rol requerido: `BUSINESS_OWNER` dueño del negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdateRequest'
      responses:
        '200':
          description: Negocio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Business]
      operationId: deactivateBusiness
      summary: Desactivar (borrado lógico) un negocio
      description: |-
        Marca `businesses.is_active = false`. No elimina físicamente el registro
        porque tiene reservaciones y reseñas asociadas.

        Rol requerido: `BUSINESS_OWNER` dueño del negocio.
      responses:
        '204':
          description: Negocio desactivado.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/location:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: getBusinessLocation
      summary: Obtener la ubicación de un negocio
      security: []
      description: |-
        Acceso: público (no requiere JWT).
      responses:
        '200':
          description: Ubicación del negocio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessLocation'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Business]
      operationId: upsertBusinessLocation
      summary: Crear o reemplazar la ubicación de un negocio
      description: |-
        `business_locations.business_id` es único: como máximo una ubicación por
        negocio. Este endpoint crea la fila si no existe o la reemplaza si ya existe.

        Rol requerido: `BUSINESS_OWNER` dueño del negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessLocationUpsertRequest'
            example:
              address: 200 metros norte de la iglesia católica, San José Centro
              city: San José
              province: San José
              country: Costa Rica
              postalCode: "10101"
              location: { latitude: 9.9325, longitude: -84.0795 }
      responses:
        '200':
          description: Ubicación creada o reemplazada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessLocation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/contacts:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: listBusinessContacts
      summary: Listar los contactos de un negocio
      security: []
      description: |-
        Acceso: público (no requiere JWT).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Página de contactos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessContacts'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createBusinessContact
      summary: Agregar un contacto a un negocio
      description: |-
        Rol requerido: `BUSINESS_OWNER` dueño del negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessContactCreateRequest'
            example:
              type: WHATSAPP
              value: "+506 8888-3344"
              isPrimary: true
      responses:
        '201':
          description: Contacto creado.
          content:

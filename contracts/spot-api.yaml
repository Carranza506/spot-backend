  /business/businesses/{businessId}/hours:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: listBusinessHours
      summary: Listar el horario semanal de un negocio
      security: []
      description: |-
        Devuelve hasta 7 filas de `business_hours` (una por `day_of_week`, 0=domingo..6=sábado).

        Acceso: público (no requiere JWT).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Página de horarios semanales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessHours'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Business]
      operationId: replaceBusinessHours
      summary: Reemplazar el horario semanal completo de un negocio
      description: |-
        Reemplaza (upsert por `day_of_week`, restricción única `(business_id,day_of_week)`)
        el horario semanal completo del negocio en una sola operación. Cada día debe
        cumplir que, si `isClosed=false`, `openTime` y `closeTime` sean requeridos y
        `openTime < closeTime` (validado por el CHECK de `business_hours`).

        Rol requerido: `BUSINESS_OWNER` dueño del negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessHoursUpsertRequest'
            example:
              hours:
                - dayOfWeek: 1
                  isClosed: false
                  openTime: "09:00:00"
                  closeTime: "18:00:00"
                - dayOfWeek: 0
                  isClosed: true
      responses:
        '200':
          description: Horario semanal actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessHour'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /business/businesses/{businessId}/schedule-exceptions:
    parameters:
      - $ref: '#/components/parameters/BusinessIdParam'
    get:
      tags: [Business]
      operationId: listBusinessScheduleExceptions
      summary: Listar excepciones de horario de un negocio
      security: []
      description: |-
        Lista `business_schedule_exceptions` (feriados, cierres puntuales u horarios
        especiales por fecha), que tienen prioridad sobre `business_hours` al calcular
        disponibilidad.

        Acceso: público (no requiere JWT).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página de excepciones de horario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScheduleExceptions'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Business]
      operationId: createBusinessScheduleException
      summary: Crear una excepción de horario
      description: |-
        `(business_id, exception_date)` es único: no puede haber dos excepciones para
        la misma fecha. Si `isClosed=false`, requiere `openTime < closeTime`.

        Rol requerido: `BUSINESS_OWNER` dueño del negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessScheduleExceptionCreateRequest'
            example:
              exceptionDate: "2026-12-25"
              isClosed: true
              reason: Feriado de Navidad
      responses:
        '201':
          description: Excepción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessScheduleException'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

